</style></head><body><main class="page"><div class="toolbar"><strong style="font-size:16px;color:#566f60">TOTCO / SEVEN — Invoice Form</strong><div><button class="alt" type="button" onclick="setLang('en')">🇺🇸 English</button> <button class="alt" type="button" onclick="setLang('pt')">🇧🇷 Português</button></div></div><h1 data-en="Commercial Invoice Information & Confirmation" data-pt="Informações e confirmação para invoices comerciais"></h1><p class="intro" data-en="Please review the pre-filled information, mark each item as Confirmed or Needs correction, and complete the missing fields. TOTCO is the seller for both buyers; please complete the commercial information section below. When finished, select Save as PDF and email the PDF to the person who requested it. This form does not send data automatically." data-pt="Revise os dados pré-preenchidos, marque cada item como Confirmado ou Precisa corrigir e complete os campos faltantes. A TOTCO é a vendedora das duas compradoras; preencha a seção de informações comerciais abaixo. Ao terminar, clique em Salvar em PDF e envie o PDF por e-mail à pessoa solicitante. O formulário não envia dados automaticamente."></p><form id="form"><div id="sections"></div><div class="foot"><div class="grid" id="finalfields"></div><p class="muted" data-en="Bank account details are sensitive. Verify any changes independently by calling a trusted phone number, and share completed forms through an approved secure channel." data-pt="Dados bancários são sensíveis. Confirme mudanças por telefone em um número confiável e compartilhe o formulário preenchido por um canal seguro."></p><div class="buttons"><button type="button" onclick="savePdf()" data-en="Save as PDF / Print" data-pt="Salvar em PDF / Imprimir"></button><button type="button" class="alt" onclick="downloadBackup()" data-en="Download backup (.json)" data-pt="Baixar cópia (.json)"></button><button type="button" class="alt" onclick="document.getElementById('restore').click()" data-en="Restore function downloadBackup(){let obj={};document.querySelectorAll('#form [name]').forEach(el=>obj[el.name]=el.value);let b=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='TOTCO_Two_Seven_Buyers_answers.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function restoreBackup(el){let f=el.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let obj=JSON.parse(r.result);document.querySelectorAll('#form [name]').forEach(e=>{if(Object.prototype.hasOwnProperty.call(obj,e.name))e.value=obj[e.name]});setLang(lang)}catch(e){alert('Invalid JSON file / Arquivo JSON inválido')}};r.readAsText(f)}
